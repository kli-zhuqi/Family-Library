services:
  deeptutor:
    image: ghcr.io/hkuds/deeptutor:latest
    container_name: family-library-deeptutor
    ports:
      - "127.0.0.1:3782:3782"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data/deeptutor:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
